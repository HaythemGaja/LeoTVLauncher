name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare build paths and temporary debug key
        shell: bash
        run: |
          ln -s "$ANDROID_HOME" sdk
          ln -s "$JAVA_HOME" jdk
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build and verify APK
        run: bash source/build-apk.sh

      - name: Upload debug-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LeoTVLauncher-debug
          path: source/build/out/LeoTVLauncher.apk
          if-no-files-found: error
          retention-days: 14
